name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Qt / OpenGL system libraries needed to run the napari GUI tests headless.
      - name: Install Qt libs
        uses: tlambert03/setup-qt-libs@v1

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          # A Qt backend for the GUI tests (pytest-qt drives it under xvfb).
          python -m pip install -e ".[dev]" pyqt5

      # Run under a virtual X server so the napari GUI viewer works headless.
      - name: Run tests
        uses: aganders3/headless-gui@v2
        with:
          run: python -m pytest --color=yes
