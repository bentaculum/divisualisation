name: Deploy to PyPI

# Publish to PyPI when a GitHub Release is published. The release tag drives the
# version via setuptools-scm, so cut a release tagged e.g. "v0.1.0".
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/divisualisation/
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token / secret needed;
      # configure the trusted publisher once at
      # https://pypi.org/manage/account/publishing/ (workflow: deploy.yml,
      # environment: pypi).
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm needs full history + tags to derive the version.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
