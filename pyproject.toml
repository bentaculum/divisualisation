[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "divisualisation"
authors = [
    {name = "Benjamin Gallusser", email = "bgallusser@gmail.com"}
]
license = {text = "MIT License"}
description = "Visualize cell tracking errors"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    # Required for the napari hub to list this plugin (the hub crawls PyPI for it).
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # >=0.7 only for the lift's default camera angles (0.7.0 changed the angle
    # convention). Safe to relax, but the default 3D view angles would be off.
    "napari>=0.7",
    "superqt",
    "napari-animation",
    "magicgui",
    "numpy",
    "networkx",
    "scipy",  # used by the vendored napari loader (_napari_loader.py)
    "tqdm",  # progress bars (utils loaders + vendored napari loader)
    # load_napari_data (traccuracy PR #358) isn't in a traccuracy release yet, so
    # it's vendored here (see divisualisation._napari_loader) and we depend on a
    # released traccuracy instead of the PR git branch (PyPI rejects git deps).
    # Floor is >=0.4.1: that's where the EdgeFlag string values settled to
    # "ctc_fn"/"ctc_fp" (our error overlay layers are named after them). No upper
    # bound. Drop the vendored loader and relax this once #358 is released.
    "traccuracy>=0.4.1",
]

[project.urls]
"Homepage" = "https://github.com/bentaculum/divisualisation"
"Source Code" = "https://github.com/bentaculum/divisualisation"
"Bug Tracker" = "https://github.com/bentaculum/divisualisation/issues"
"User Support" = "https://github.com/bentaculum/divisualisation/issues"

[project.entry-points."napari.manifest"]
divisualisation = "divisualisation:napari.yaml"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "ruff",
    "mypy",
    "pre-commit",
    "twine",
    "build",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["divisualisation"]
include-package-data = true

[tool.setuptools.package-data]
divisualisation = ["napari.yaml"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
    "D",   # pydocstyle
]
ignore = [
    "D100", # Missing docstring in public mod
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D205", # 1 blank line required between summary line and description
    "D417", # Missing argument description in docstring
    "E402", # Module level import not at top of file
    "E501", # Line too long
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-v -s"
testpaths = ["tests"]

[tool.setuptools_scm]
write_to = "src/divisualisation/_version.py"